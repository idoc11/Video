}

// ───────── физика обломков (детерминированно, один раз при загрузке) ─────────
function buildDebris() {

  const P = [], sizes = [[1.9, .12, .8], [.1, 1.2, .8], [.1, 1.2, .8], [1.8, 1.1, .08], [1.0, .5, .08], [.5, .9, .08], [1.5, .2, .5], [.16, .9, .16], [.16, .9, .16], [.3, .15, .3]];
  for (let i = 0; i < 10; i++) P.push({ s: sizes[i], col: i < 9 ? ['#3a2418', '#4a2e1e', '#2e1c12'][i % 3] : '#c9a24a' });
  for (let i = 0; i < 16; i++) P.push({ s: [.07, .045, .62], col: '#f6f2e6', key: 1 }); for (let i = 0; i < 9; i++) P.push({ s: [.05, .05, .36], col: '#17141c', key: 1 });

    const p = S[i];

      p.vy -= 9.8 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.rz += p.wz * dt; p.rx += p.wx * dt;

// ───────── поза персонажа: ноги и руки через IK ─────────
function poseGuy(W, o) {
  // o: x (мировой x бёдер), fac (±1), phase, amp, lift, lean, hipY, hands: [[wx,wy]|null, ...] , armSw
  const g = W.root, s = g.scale.x; g.scale.x = Math.abs(s) * o.fac; const sc = Math.abs(s);
  W.body.rotation.z = o.lean || 0;
  const cosL = Math.cos(o.lean || 0), sinL = Math.sin(o.lean || 0);
  const hipWorld = [o.x, o.hipY];
  g.position.set(o.x, o.hipY, o.z || 0);
  for (let i = 0; i < 2; i++) {
    const ph = o.phase + i * Math.PI, fx = o.x + o.fac * (o.amp * Math.sin(ph)), lift = Math.max(0, Math.cos(ph)) * o.lift;
    const fy = stairH(fx) + .13 * sc + lift;                        // ступня
    const lx = (fx - o.x) * o.fac / sc, ly = (fy - o.hipY) / sc;    // в локали (до учёта наклона корпуса: бёдра повёрнуты вместе с корпусом)
    const rx = lx * cosL + ly * sinL, ry = -lx * sinL + ly * cosL;   // обратный поворот
    const [r1, r2] = ik(.5, .5, rx, ry + .02, 1); W.legs[i].th.rotation.z = r1; W.legs[i].sh.rotation.z = r2 - r1;
  }
  for (let i = 0; i < 2; i++) {
    const h = o.hands && o.hands[i];
    let tx, ty;
    if (o.hl && h) { tx = h[0]; ty = h[1]; }
    else if (h) { const sh = [o.x + o.fac * Math.sin(o.lean || 0) * -.66 * sc * 0, 0]; tx = (h[0] - o.x) * o.fac / sc; ty = (h[1] - o.hipY) / sc; }
    else { const sw = Math.sin(o.phase + (i ? 0 : Math.PI)) * (o.armSw || .2); tx = .1 + sw; ty = .66 - .78; }
    const sx = 0, sy = .66; const rx = (tx - sx) * cosL + (ty - sy) * sinL, ry = -(tx - sx) * sinL + (ty - sy) * cosL;
    const [r1, r2] = ik(.42, .4, rx, ry, -1); W.arms[i].up.rotation.z = r1; W.arms[i].fo.rotation.z = r2 - r1;
  }
}

function speaking(who, t) { for (const l of M.lines) if (l.who === who && t >= l.start && t <= l.end) return .35 + .65 * Math.abs(Math.sin(t * 15 + l.start)); return 0; }
const camKeys = [[0, 2.6, 2.6, 15, -.8], [3.6, 3.8, 3.4, 15.5, -.8], [8, 7.0, 6.0, 15.5, -1.0], [11.0, 9.4, 7.6, 15.0, -1.0]];
function keyCam(t) {
  if (t >= camKeys[camKeys.length - 1][0]) return camKeys[camKeys.length - 1].slice(1);
  let a = camKeys[0], b = camKeys[1];
  for (let i = 0; i < camKeys.length - 1; i++) if (t >= camKeys[i][0] && t < camKeys[i + 1][0]) { a = camKeys[i]; b = camKeys[i + 1]; break; }
  const u = sm(a[0], b[0], t); return [lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u), lerp(a[4], b[4], u)];
