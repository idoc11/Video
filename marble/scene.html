<!doctype html><html><head><meta charset="utf-8"><title>Гонка шариков</title>
<style>
@font-face{font-family:Mont;font-weight:900;src:url(/engine/fonts/montserrat-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+2116}
@font-face{font-family:Mont;font-weight:900;src:url(/engine/fonts/montserrat-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212}
html,body{margin:0;background:#000}#stage{position:relative;width:1080px;height:1920px;overflow:hidden}canvas{position:absolute;left:0;top:0}
#ui{position:absolute;inset:0;font-family:Mont,sans-serif;font-weight:900;color:#fff;pointer-events:none}
#title{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:44px;letter-spacing:6px;text-shadow:0 4px 0 rgba(0,0,0,.6)}

.chip{width:58px;height:58px;border-radius:50%;border:5px solid rgba(255,255,255,.9);box-shadow:0 4px 0 rgba(0,0,0,.5)}

#board div{display:flex;align-items:center;gap:14px}.dot{width:28px;height:28px;border-radius:50%;border:3px solid #fff}

#cap{position:absolute;left:30px;right:170px;top:1440px;text-align:center;font-size:70px;line-height:1.08;text-shadow:0 6px 0 rgba(0,0,0,.65),0 0 30px rgba(0,0,0,.7)}
#cap small{display:block;margin-top:12px;font-size:40px;opacity:.95}
#hook{position:absolute;left:0;right:0;top:760px;text-align:center;font-size:150px;line-height:1.02;text-shadow:0 8px 0 rgba(0,0,0,.65),0 0 50px rgba(0,0,0,.7)}
#hook small{display:block;margin-top:24px;font-size:56px;color:#ffd400}
#wm{position:absolute;left:48px;top:60px;font-size:26px;opacity:.55}
</style></head><body><div id="stage"><canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><div id="title">ГОНКА ШАРИКОВ</div><div id="chips"></div><div id="board"></div><div id="count"></div><div id="cap"></div><div id="hook"></div><div id="wm">@id0cs</div></div></div>
<script src="/balls/node_modules/three/build/three.min.js"></script>
<script>
'use strict';
const PAL = ['#ff2d2d', '#ff8a1f', '#ffd400', '#2fe05a', '#19c3ff', '#2a56ff', '#9a3dff', '#ff4fb8'];
let META, BUF, R_, scene, cam, balls, shadows, sparks, gateMesh;
const FOV = 30, ASPECT = 1080 / 1920, BR = 0.45;
window.init = async function () {
  META = await (await fetch('/marble/data/meta.json')).json();
  BUF = new Float32Array(await (await fetch('/marble/data/frames.bin')).arrayBuffer());
  await document.fonts.load('900 100px Mont', 'АБВ 0123');
  document.getElementById('chips').innerHTML = PAL.map(c => `<div class="chip" style="background:${c}"></div>`).join('');
  R_ = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
  R_.setSize(1080, 1920, false); R_.toneMapping = THREE.ACESFilmicToneMapping; R_.toneMappingExposure = 1.15; R_.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  const bg = document.createElement('canvas'); bg.width = 256; bg.height = 512; const bc = bg.getContext('2d'); const gr = bc.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, '#1a1240'); gr.addColorStop(1, '#070a1a'); bc.fillStyle = gr; bc.fillRect(0, 0, 256, 512);
  scene.background = new THREE.CanvasTexture(bg); scene.background.colorSpace = THREE.SRGBColorSpace;
  const env = new THREE.Scene(); env.background = new THREE.Color('#141a38');
  for (const [x, y, z, w, h, i, c] of [[0, 7, 2, 10, 7, 7, '#ffffff'], [-9, 2, 5, 4, 12, 3.2, '#9fd8ff'], [9, 2, 5, 4, 12, 3.2, '#ffb0e8'], [0, -7, 3, 12, 4, 1.0, '#8a7bff'], [0, 0, 9, 14, 3, 2.2, '#ffffff']]) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(i), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); }
  scene.environment = new THREE.PMREMGenerator(R_).fromScene(env, .03).texture;
  cam = new THREE.PerspectiveCamera(FOV, ASPECT, .1, 400);
  const key = new THREE.DirectionalLight('#fff', 2.2); key.position.set(-6, 14, 20); scene.add(key); const rim = new THREE.DirectionalLight('#6fe9ff', 1.4); rim.position.set(8, 3, 6); scene.add(rim); scene.add(new THREE.AmbientLight('#8a90ff', .35));
  const wt = document.createElement('canvas'); wt.width = 512; wt.height = 1024; const wc = wt.getContext('2d'); wc.fillStyle = '#0c1126'; wc.fillRect(0, 0, 512, 1024);
  for (const [x, y, r, c] of [[110, 180, 260, 'rgba(110,80,255,.28)'], [420, 520, 300, 'rgba(0,200,255,.18)'], [150, 860, 280, 'rgba(255,60,200,.18)']]) { const g = wc.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); wc.fillStyle = g; wc.fillRect(0, 0, 512, 1024); }
  wc.strokeStyle = 'rgba(120,140,255,.07)'; wc.lineWidth = 2; for (let x = 0; x <= 512; x += 64) { wc.beginPath(); wc.moveTo(x, 0); wc.lineTo(x, 1024); wc.stroke(); } for (let y = 0; y <= 1024; y += 64) { wc.beginPath(); wc.moveTo(0, y); wc.lineTo(512, y); wc.stroke(); }
  const wtex = new THREE.CanvasTexture(wt); wtex.colorSpace = THREE.SRGBColorSpace; wtex.wrapS = wtex.wrapT = THREE.RepeatWrapping; wtex.repeat.set(3, 12);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 300), new THREE.MeshStandardMaterial({ map: wtex, roughness: .6, metalness: .1, emissiveMap: wtex, emissive: '#fff', emissiveIntensity: .5 })); wall.position.set(0, -35, -1.3); scene.add(wall);
  const neon = new THREE.MeshBasicMaterial({ color: '#3df2ff' }), neonP = new THREE.MeshBasicMaterial({ color: '#ff4fd8' });
  const body = new THREE.MeshPhysicalMaterial({ color: '#1b2244', metalness: .65, roughness: .28, clearcoat: .6 }), wallMat = new THREE.MeshPhysicalMaterial({ color: '#141a36', metalness: .5, roughness: .35, clearcoat: .4 });
  for (const s of META.segs) {
    const [ax, ay] = s.a, [bx, by] = s.b, len = Math.hypot(bx - ax, by - ay), ang = Math.atan2(by - ay, bx - ax);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len + s.th, s.th, 1.8), s.kind === 'wall' ? wallMat : (s.kind === 'gate' ? new THREE.MeshPhysicalMaterial({ color: '#ffd23a', metalness: .6, roughness: .3 }) : body)); m.position.set((ax + bx) / 2, (ay + by) / 2, 0); m.rotation.z = ang; scene.add(m);
    if (s.kind === 'gate') gateMesh = m;
    if (s.kind === 'ramp') { const e = new THREE.Mesh(new THREE.BoxGeometry(len, .05, .1), neon); e.position.set(0, s.th / 2 + .01, .92); m.add(e); }
    if (s.kind === 'wall') { const e = new THREE.Mesh(new THREE.BoxGeometry(len, .05, .1), neonP); e.position.set(0, 0, .92); m.add(e); }
  }
  for (const p of META.pegs) { const m = new THREE.Mesh(new THREE.CylinderGeometry(p.r, p.r, 1.8, 24), new THREE.MeshPhysicalMaterial({ color: '#ffb02e', metalness: .7, roughness: .22, clearcoat: 1 })); m.rotation.x = Math.PI / 2; m.position.set(p.c[0], p.c[1], 0); scene.add(m); }
  // финишная черта
  const fc = document.createElement('canvas'); fc.width = 512; fc.height = 64; const fx = fc.getContext('2d'); for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++) { fx.fillStyle = (i + j) % 2 ? '#fff' : '#111'; fx.fillRect(i * 32, j * 32, 32, 32); }
  const ft = new THREE.CanvasTexture(fc); const fm = new THREE.Mesh(new THREE.PlaneGeometry(10, 1.2), new THREE.MeshBasicMaterial({ map: ft })); fm.position.set(0, META.fin_y + .6, .95); scene.add(fm);
  const tex = document.createElement('canvas'); tex.width = 256; tex.height = 128; const tc = tex.getContext('2d'); tc.fillStyle = '#fff'; tc.fillRect(0, 0, 256, 128); tc.fillStyle = '#b4b4b4'; tc.fillRect(0, 44, 256, 40); tc.fillStyle = '#4a4a4a'; tc.fillRect(0, 38, 256, 6); tc.fillRect(0, 84, 256, 6);
  const map = new THREE.CanvasTexture(tex); map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = 8;
  balls = new THREE.InstancedMesh(new THREE.SphereGeometry(BR, 48, 32), new THREE.MeshPhysicalMaterial({ map, roughness: .1, clearcoat: 1, clearcoatRoughness: .03, envMapIntensity: 1.4, reflectivity: .6 }), META.nb); balls.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(META.nb * 3), 3); balls.frustumCulled = false; scene.add(balls);
  shadows = new THREE.InstancedMesh(new THREE.CircleGeometry(BR * 1.15, 24), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: .42, depthWrite: false }), META.nb); shadows.frustumCulled = false; shadows.position.z = -1.2; scene.add(shadows);
  sparks = new THREE.InstancedMesh(new THREE.BoxGeometry(.22, .12, .02), new THREE.MeshBasicMaterial({ color: '#fff' }), META.spark); sparks.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(META.spark * 3), 3); sparks.frustumCulled = false; scene.add(sparks);
  return META.frames;
};
const dummy = new THREE.Object3D(), col = new THREE.Color(); const CONF = ['#ff2d2d', '#ffd400', '#2fe05a', '#19c3ff', '#ff4fb8', '#fff'];
window.renderFrame = function (f) {
  f = Math.min(f, META.frames - 1); const o = f * META.per, H = META.hdr, NB = META.nb;
  const cy = BUF[o], wv = BUF[o + 1], roll = BUF[o + 2], d = BUF[o + 3], phase = BUF[o + 4], cd = BUF[o + 5], gate = BUF[o + 6], winner = BUF[o + 7], nfin = BUF[o + 16];
  const rank = Array.from({ length: NB }, (_, i) => BUF[o + 8 + i] | 0);
  const Hv = wv / ASPECT, dist = Hv / (2 * Math.tan(FOV * Math.PI / 360));
  cam.position.set(Math.sin(d * .5) * .2, cy, dist); cam.lookAt(0, cy, 0); cam.rotation.z += roll; cam.updateMatrixWorld(); gateMesh.visible = gate < .5;
  for (let i = 0; i < NB; i++) {
    const b = o + H + i * 5; dummy.position.set(BUF[b], BUF[b + 1], 0); dummy.scale.set(1, 1, 1); dummy.rotation.set(0, 0, BUF[b + 2]); dummy.updateMatrix(); balls.setMatrixAt(i, dummy.matrix);
    col.set(PAL[BUF[b + 3] | 0]); col.multiplyScalar(1 + 1.6 * BUF[b + 4]); balls.setColorAt(i, col);
    dummy.position.set(BUF[b] + .1, BUF[b + 1] - .13, 0); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); shadows.setMatrixAt(i, dummy.matrix);
  }
  balls.instanceMatrix.needsUpdate = true; balls.instanceColor.needsUpdate = true; shadows.instanceMatrix.needsUpdate = true;
  const so = o + H + NB * 5;
  for (let i = 0; i < META.spark; i++) { const b = so + i * 3, a = BUF[b + 2]; if (a <= 0) { dummy.scale.set(0, 0, 0); dummy.position.set(0, 1e6, 0); } else { dummy.position.set(BUF[b], BUF[b + 1], .5); dummy.scale.set(1, 1, 1); } dummy.rotation.set(0, 0, i * 1.3 + d * 6); dummy.updateMatrix(); sparks.setMatrixAt(i, dummy.matrix); col.set(CONF[i % CONF.length]); sparks.setColorAt(i, col); }
  sparks.instanceMatrix.needsUpdate = true; sparks.instanceColor.needsUpdate = true;
  R_.render(scene, cam);
  // интерфейс
  const bd = document.getElementById('board'), medals = ['1', '2', '3'];
  bd.innerHTML = phase < 1 ? '' : rank.slice(0, 3).map((id, k) => `<div><span style="width:30px">${medals[k]}</span><span class="dot" style="background:${PAL[id]}"></span><span>${META.names[id]}</span></div>`).join('');
  const ct = document.getElementById('count'); let ctxt = '', cs = 1, ccol = '#fff';
  if (cd >= 1 && cd <= 3) { ctxt = String(cd | 0); ccol = ['#ff4a4a', '#ffd400', '#2fe05a'][3 - (cd | 0)]; const frac = (d - [1.8, 2.4, 3.0][3 - (cd | 0)]) / .6; cs = 1 + .4 * Math.exp(-Math.max(0, frac) * 6); }
  else if (cd === 0 && d < META.pre + .9) { ctxt = 'СТАРТ!'; ccol = '#2fe05a'; cs = .5 + .0; ct.style.fontSize = '170px'; } else ct.style.fontSize = '300px';
  ct.textContent = ctxt; ct.style.color = ccol; ct.style.transform = `scale(${cs})`;
  const cap = document.getElementById('cap');
  const hk = document.getElementById('hook'); const hkOp = d < META.pre - .15 ? Math.min(1, d / .2) : Math.max(0, 1 - (d - (META.pre - .15)) / .25);
  hk.style.opacity = hkOp; hk.innerHTML = d < META.pre + .2 ? 'ВЫБЕРИ<br><span style="color:#ffd400">ЦВЕТ</span><small>ПОБЕДИТ ТОЛЬКО ОДИН</small>' : '';
  if (d < META.pre) cap.innerHTML = '';
  else if (nfin >= 1 && d > META.audio_first) cap.innerHTML = `ПОБЕДИЛ<br><span style="color:${PAL[winner | 0]}">${META.names[winner | 0]}</span><small>УГАДАЛ? ПИШИ В КОММЕНТАРИИ</small>`;
  else cap.innerHTML = '';
  const dur = META.duration, fo = d > dur - .3 ? Math.max(0, (dur - d) / .3) : 1, fi = Math.min(1, d / .15); document.getElementById('ui').style.opacity = Math.min(fo, 1);
  return true;
};
</script></body></html>
